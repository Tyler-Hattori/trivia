<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art History Trainer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui,sans-serif} input{outline:none}</style>
</head>
<body class="bg-zinc-100 min-h-screen p-6">
<div class="max-w-4xl mx-auto bg-white rounded-2xl shadow p-6">
<h1 class="text-3xl font-bold mb-2">Art History Trainer</h1>
<p class="text-zinc-600 mb-4">Random painting quiz with multiple typed answers.</p>
<div class="mb-4">
<textarea id="csv" class="w-full h-32 border rounded-xl p-3 text-sm" placeholder="Paste CSV: image,title,artist,year,genre\nhttps://...jpg,Scrovegni Chapel,Giotto,1305,Proto-Renaissance"></textarea>
<button onclick="loadCSV()" class="mt-2 px-4 py-2 bg-black text-white rounded-xl">Load Dataset</button>
</div>
<div id="quiz" class="hidden">
<div class="flex justify-between items-center mb-4"><div id="progress" class="text-sm text-zinc-500"></div><button onclick="nextCard()" class="px-3 py-2 border rounded-xl">Skip</button></div>
<img id="img" class="w-full max-h-[420px] object-contain rounded-xl bg-zinc-50 mb-4" />
<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
<input id="title" placeholder="Title" class="border rounded-xl p-3" />
<input id="artist" placeholder="Artist" class="border rounded-xl p-3" />
<input id="year" placeholder="Year" class="border rounded-xl p-3" />
<input id="genre" placeholder="Genre" class="border rounded-xl p-3" />
</div>
<button onclick="grade()" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-xl">Submit</button>
<div id="result" class="mt-4 text-sm"></div>
</div>
</div>
<script>
let data=[]; let current=null; let seen=0;
function parseCSV(text){return text.trim().split(/\n+/).map(r=>r.split(',').map(x=>x.trim()));}
function loadCSV(){const rows=parseCSV(document.getElementById('csv').value); data=rows.map(r=>({image:r[0],title:r[1],artist:r[2],year:r[3],genre:r[4]})).filter(x=>x.image); if(data.length){document.getElementById('quiz').classList.remove('hidden'); nextCard();}}
function rand(){return data[Math.floor(Math.random()*data.length)];}
function nextCard(){current=rand(); seen++; document.getElementById('img').src=current.image; ['title','artist','year','genre'].forEach(id=>document.getElementById(id).value=''); document.getElementById('result').innerHTML=''; document.getElementById('progress').textContent='Card '+seen; document.getElementById('title').focus();}
function norm(s){return (s||'').toLowerCase().trim();}
function check(a,b){return norm(a)===norm(b);}
function grade(){let fields=['title','artist','year','genre']; let html=''; let score=0; fields.forEach(f=>{const user=document.getElementById(f).value; const ok=check(user,current[f]); if(ok) score++; html+=`<div><b>${f}:</b> ${ok?'✓':'✗'} <span class='text-zinc-500'>(Answer: ${current[f]})</span></div>`;}); html=`<div class='font-semibold mb-2'>Score: ${score}/4</div>`+html+`<button onclick='nextCard()' class='mt-3 px-4 py-2 bg-black text-white rounded-xl'>Next Card</button>`; document.getElementById('result').innerHTML=html;}
window.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); if(document.activeElement.tagName==='INPUT') grade();}})
</script>
</body>
</html>
