<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Quiz Hub Production</title>
<script src='https://cdn.tailwindcss.com'></script>
</head>
<body class='bg-zinc-100 min-h-screen text-zinc-900'>
<div class='max-w-6xl mx-auto p-6'>
<header class='mb-8'>
<h1 class='text-5xl font-bold tracking-tight'>Quiz Hub</h1>
<p class='text-zinc-600 mt-2'>Production-ready template with GitHub CSV sync, scores, separate pages.</p>
</header>
<div id='home'></div>
<div id='quizPage' class='hidden'></div>
</div>
<script>
/* ================= CONFIG ================= */
const OWNER='tyler-hattori';
const REPO='trivia';
const BRANCH='main';
const QUIZZES=[
 {key:'art',title:'Art History',file:'datasets/art.csv',fields:['title','artist','year','genre']},
 {key:'music',title:'Music',file:'datasets/music.csv',fields:['title','artist','year','genre']}
];
/* PAT is requested at runtime and stored locally */
let token=localStorage.getItem('gh_pat')||'';
let active=null,data=[],current=null;
/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
function scoreKey(k){return 'score_'+k}
function best(k){return localStorage.getItem(scoreKey(k))||0}
function setBest(k,v){if(v>best(k))localStorage.setItem(scoreKey(k),v)}
function parseCSV(t){return t.trim().split(/\n+/).slice(1).map(r=>{const c=r.split(',');return {image:c[0],title:c[1],artist:c[2],year:c[3],genre:c[4]}})}
function csvOut(rows){return 'image,title,artist,year,genre\n'+rows.map(r=>[r.image,r.title,r.artist,r.year,r.genre].join(',')).join('\n')}
function rand(){return data[Math.floor(Math.random()*data.length)]}
/* ================= HOME ================= */
function renderHome(){
 $('#home').innerHTML=`<div class='grid md:grid-cols-3 gap-5'>${QUIZZES.map(q=>`<button onclick="openQuiz('${q.key}')" class='bg-white rounded-3xl shadow p-6 text-left hover:shadow-lg transition'><div class='text-2xl font-semibold'>${q.title}</div><div class='text-zinc-500 mt-2'>Best Score: ${best(q.key)}</div></button>`).join('')}</div><div class='mt-8 bg-white rounded-3xl shadow p-6'><div class='font-semibold mb-2'>GitHub Token</div><input id='pat' class='border rounded-xl p-3 w-full' placeholder='Paste PAT token' value='${token}'><button onclick='saveToken()' class='mt-3 px-4 py-2 bg-black text-white rounded-xl'>Save Token</button></div>`;
}
function saveToken(){token=$('#pat').value.trim();localStorage.setItem('gh_pat',token);alert('Saved locally');}
/* ================= QUIZ PAGE ================= */
async function openQuiz(key){active=QUIZZES.find(q=>q.key===key); $('#home').classList.add('hidden'); $('#quizPage').classList.remove('hidden'); await loadDataset(); nextCard();}
async function loadDataset(){const txt=await fetch(active.file).then(r=>r.text()); data=parseCSV(txt); renderQuizPage();}
function renderQuizPage(){ $('#quizPage').innerHTML=`<button onclick='goHome()' class='mb-4 px-3 py-2 border rounded-xl'>← Home</button><div class='bg-white rounded-3xl shadow p-6'><div class='flex justify-between'><h2 class='text-3xl font-bold'>${active.title}</h2><div>Best: ${best(active.key)}</div></div><img id='img' class='w-full max-h-[420px] object-contain bg-zinc-50 rounded-2xl my-5'><div class='grid md:grid-cols-2 gap-3'>${active.fields.map(f=>`<input id='${f}' class='border rounded-xl p-3' placeholder='${f}'>`).join('')}</div><div class='mt-4 flex gap-3'><button onclick='grade()' class='px-4 py-2 bg-blue-600 text-white rounded-xl'>Submit</button><button onclick='nextCard()' class='px-4 py-2 border rounded-xl'>Next</button></div><div id='result' class='mt-4 text-sm'></div></div><div class='bg-white rounded-3xl shadow p-6 mt-6'><h3 class='text-xl font-semibold mb-3'>Add Entry + Sync CSV</h3><div class='grid md:grid-cols-2 gap-3'><input id='nimage' class='border rounded-xl p-3' placeholder='Image URL'><input id='ntitle' class='border rounded-xl p-3' placeholder='Title'><input id='nartist' class='border rounded-xl p-3' placeholder='Artist'><input id='nyear' class='border rounded-xl p-3' placeholder='Year'><input id='ngenre' class='border rounded-xl p-3 md:col-span-2' placeholder='Genre'></div><button onclick='addEntry()' class='mt-4 px-4 py-2 bg-black text-white rounded-xl'>Commit to GitHub CSV</button><div class='text-xs text-zinc-500 mt-2'>Uses GitHub Contents API.</div></div>`; }
function nextCard(){current=rand(); $('#img').src=current.image; active.fields.forEach(f=>$('#'+f).value=''); $('#result').innerHTML='';}
function grade(){let s=0,out=''; active.fields.forEach(f=>{const ok=$('#'+f).value.trim().toLowerCase()==String(current[f]).trim().toLowerCase(); if(ok)s++; out+=`<div>${f}: ${ok?'✓':'✗'} <span class='text-zinc-500'>${current[f]}</span></div>`}); setBest(active.key,s); $('#result').innerHTML=`<div class='font-semibold mb-2'>Score ${s}/${active.fields.length}</div>`+out;}
function goHome(){ $('#quizPage').classList.add('hidden'); $('#home').classList.remove('hidden'); renderHome();}
/* ================= GITHUB SYNC ================= */
async function addEntry(){if(!token){alert('Save PAT token first');return;} const row={image:$('#nimage').value,title:$('#ntitle').value,artist:$('#nartist').value,year:$('#nyear').value,genre:$('#ngenre').value}; data.push(row); const path=active.file; const meta=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()); const content=csvOut(data); await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({message:'Update '+path,content:btoa(unescape(encodeURIComponent(content))),sha:meta.sha,branch:BRANCH})}); alert('CSV committed to GitHub'); loadDataset();}
renderHome();
</script></body></html>
