/* =========================================================
   CSV
========================================================= */
function parseCSV(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(x=>x.trim());
  const out=[];

  function splitCSVRow(line){
    const cols=[];
    let cur='';
    let inQuotes=false;

    for(let i=0;i<line.length;i++){
      const ch=line[i];

      if(ch === '"'){
        if(inQuotes && line[i+1] === '"'){
          cur+='"';
          i++;
        }else{
          inQuotes=!inQuotes;
        }
      }
      else if(ch===',' && !inQuotes){
        cols.push(cur.trim());
        cur='';
      }
      else{
        cur+=ch;
      }
    }

    cols.push(cur.trim());
    return cols;
  }

  for(let i=0;i<lines.length;i++){
    const cols=splitCSVRow(lines[i]);

    if(i===0 && cols[0].toLowerCase()==='image') continue;

    out.push({
      image:cols[0]||'',
      title:cols[1]||'',
      artist:cols[2]||'',
      year:cols[3]||'',
      movement:cols[4]||''
    });
  }

  return out;
}

function esc(v){
  v=String(v??'');
  if(/[",\n]/.test(v)){
    return '"' + v.replace(/"/g,'""') + '"';
  }
  return v;
}

function csvOut(rows){
  const header='image,title,artist,year,movement';

  const body=rows.map(r=>
    [
      esc(r.image),
      esc(r.title),
      esc(r.artist),
      esc(r.year),
      esc(r.movement)
    ].join(',')
  );

  return header + '\n' + body.join('\n') + '\n';
}

/* =========================================================
   HELPERS
========================================================= */
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function yearNumSafe(v){
  const m=String(v||'').match(/\d{3,4}/);
  return m ? parseInt(m[0],10) : 0;
}

function yearValue(v){

  v = String(v || '');

  if(v.includes('-')){
    const p = v.split('-').map(Number);
    if(p.length === 2) return (p[0] + p[1]) / 2;
  }

  return yearNumSafe(v);
}

function nextItem(){
  if(!queue || queue.length === 0){
    return null;
  }
  return queue.shift();
}

function calcRMSE(arr){
  if(!arr.length) return 0;

  const mse =
    arr.reduce((sum,v)=>sum + v*v,0) / arr.length;

  return Math.sqrt(mse);
}

function currentQuizSizeKey(){

  const count = QUIZ_SETTINGS.count;

  if(count === 0) return 'all';

  return String(count);
}

function bestKey(name){
  return `${active.key}_${currentQuizSizeKey()}_${name}`;
}

function loadBestStats(){

  loadBestStreak();

  bestAcc = Number(
    localStorage.getItem(
      bestKey('bestAcc')
    ) || 0
  );

  const val =
    localStorage.getItem(
      bestKey('bestRmse')
    );

  bestRmse =
    val === null
      ? Infinity
      : Number(val);
}

function saveBestStats(){

  localStorage.setItem(
    bestKey('bestAcc'),
    String(bestAcc)
  );

  if(isFinite(bestRmse)){
    localStorage.setItem(
      bestKey('bestRmse'),
      String(bestRmse)
    );
  }
}

function thumbUrl(url){

  if(url.includes('upload.wikimedia.org')){
    return url + '?width=320';
  }

  return url;
}

function commitBestIfNeeded({ acc, rmse }) {
  let improved = false;

  if (acc > bestAcc) {
    bestAcc = acc;
    improved = true;
  }

  if (rmse < bestRmse) {
    bestRmse = rmse;
    improved = true;
  }

  if (improved) {
    saveBestStats();
  }
}

/* =====================================================
   BIND QUIZ UI AFTER RENDER
===================================================== */
function bindQuiz(){

  if(current){
    $('#img').src = current.image;
  }

  $('#submit').onclick = () => grade();
  $('#next').onclick = next;

  const nextBtn = $('#next');

  nextBtn.classList.add('hidden');
  nextBtn.disabled = false;
  nextBtn.style.pointerEvents = 'auto';
  nextBtn.blur();

  $('#quizCount').value =
    String(QUIZ_SETTINGS.count);

  $('#quizOrder').value =
    QUIZ_SETTINGS.order;

  document
    .querySelectorAll('.fieldOpt')
    .forEach(box=>{
      box.checked =
        QUIZ_SETTINGS.fields.includes(
          box.value
        );
    });

  FIELD_SCHEMA.forEach(f=>{

    const el = $('#'+f);

    const enabled =
      ACTIVE_FIELDS.includes(f);

    el.disabled = !enabled;

    el.classList.toggle(
      'bg-zinc-100',
      !enabled
    );

    el.classList.toggle(
      'text-zinc-400',
      !enabled
    );
  });

  document.onkeydown = (e) => {
    if(e.key !== 'Enter') return;

    if(submitted){
      e.preventDefault();
      next();
    } else {
      e.preventDefault();
      grade();
    }
  };
}

/* =========================================================
   FLOW
========================================================= */
async function start(key){

  active = QUIZZES.find(q => q.key === key);
  await load();

  streak = 0;
  answered = 0;

  totalFieldsAttempted = 0;
  totalFieldsCorrect = 0;

  fieldStats = {};

  FIELD_SCHEMA.forEach(f=>{
    fieldStats[f] = {
      attempts:0,
      correct:0
    };
  });

  yearErrors = [];

  loadBestStats();

  /* build first queue using saved settings WITHOUT touching DOM */
  buildQueueFromSettings();

  render();
}

function exitQuiz(){
  active=null;
  render();
}

async function load(){
  const txt=await fetch(active.file+'?t='+Date.now(),{
    cache:'no-store'
  }).then(r=>r.text());

  data=parseCSV(txt);
}

function buildQueueFromSettings(){

  const settings = window.QUIZ_SETTINGS || {
    count:0,
    order:'random',
    fields:[...FIELD_SCHEMA]
  };

  ACTIVE_FIELDS = [...settings.fields];

  let rows = [...data];
  shuffle(rows);

  if(settings.count > 0){
    rows = rows.slice(0, settings.count);
  }

  if(settings.order === 'chronological'){
    rows.sort((a,b)=>yearValue(a.year)-yearValue(b.year));
  }

  queue = rows;
  current = queue.shift() || null;
  submitted = false;
}


/* =====================================================
   NEXT QUESTION
===================================================== */
function next(){

  if(!submitted) return;

  current = nextItem();

  if(!current){
    showQuizFinished();
    return;
  }

  submitted = false;

  document
    .getElementById('quizFields')
    .classList.remove('hidden');

  $('#submit').classList.remove('hidden');
  $('#next').classList.add('hidden');

  $('#img').src = current.image;

  FIELD_SCHEMA.forEach(f=>{

    const el = $('#'+f);

    el.value = '';

    const enabled =
      ACTIVE_FIELDS.includes(f);

    el.disabled = !enabled;

    el.classList.toggle(
      'bg-zinc-100',
      !enabled
    );

    el.classList.toggle(
      'text-zinc-400',
      !enabled
    );
  });

  requestAnimationFrame(() => {
    const title = $('#title');
    if (title && !title.disabled) {
      title.focus();
      title.select?.();
    }
  });

  $('#result').innerHTML='';

  const rem = $('#remainingCount');
  if(rem){
    rem.textContent =
      queue.length + 1;
  }

  const nextBtn = $('#next');
  nextBtn.disabled = true;
  nextBtn.classList.add(
    'opacity-40',
    'cursor-not-allowed'
  );
}

/* =====================================================
   APPLY SETTINGS (kept between restarts)
===================================================== */
function applyQuizSettings(){

  /* if page not rendered yet */
  if(!$('#quizCount')){
    buildQueueFromSettings();
    render();
    return;
  }

  const count = Number($('#quizCount').value);
  const order = $('#quizOrder').value;

  const checked = [...document.querySelectorAll('.fieldOpt:checked')]
    .map(el => el.value);

  if(!checked.length){
    toast('Select at least one field');
    return;
  }

  QUIZ_SETTINGS = {
    count,
    order,
    fields:[...checked]
  };

  loadBestStats();

  buildQueueFromSettings();

  render();
}

/* =====================================================
   START OVER = SAME SETTINGS
===================================================== */
function restartQuiz(){

  streak = 0;
  answered = 0;

  totalFieldsAttempted = 0;
  totalFieldsCorrect = 0;

  yearErrors = [];

  fieldStats = {};

  FIELD_SCHEMA.forEach(f=>{
    fieldStats[f] = {
      attempts:0,
      correct:0
    };
  });

  loadBestStats();

  buildQueueFromSettings();
  render();
}

/* =====================================================
   QUIZ COMPLETE SCREEN
===================================================== */
function showQuizFinished(){

  const acc =
    totalFieldsAttempted
      ? Math.round(
          100 *
          totalFieldsCorrect /
          totalFieldsAttempted
        )
      : 0;

  const rmse = calcRMSE(yearErrors);

  commitBestIfNeeded({ acc, rmse, streak });

  const fieldRows = FIELD_SCHEMA.map(f=>{

    if(f === 'year'){
      return `
        <div class='border rounded-xl p-4'>
          <div class='text-lg font-semibold text-zinc-500 mb-3'>Year RMSE</div>
          <div class='text-2xl font-bold'>
            ±${rmse.toFixed(1)}y
          </div>
        </div>
      `;
    }

    const s = fieldStats[f];

    const pct = s.attempts
      ? Math.round(100 * s.correct / s.attempts)
      : 0;

    return `
      <div class='border rounded-xl p-4'>
        <div class='text-lg font-semibold text-zinc-500 mb-3 capitalize'>
          ${f}
        </div>
        <div class='text-2xl font-bold'>
          ${pct}%
        </div>
      </div>
    `;
  }).join('');

  $('#app').innerHTML = `
    <div class='max-w-2xl mx-auto'>
      <div class='bg-white rounded-2xl shadow p-8 text-center'>

        <div class='text-4xl font-bold mb-3'>
          Quiz Complete
        </div>

        <div class='text-zinc-500 mb-8'>
          Nice run.
        </div>

        <div class='grid grid-cols-2 md:grid-cols-4 gap-2 mb-8'>
          ${fieldRows}
        </div>

        <div class='flex gap-3 justify-center'>
          <button onclick='restartQuiz()'
            class='bg-blue-600 text-white px-5 py-3 rounded-xl'>
            Play Again
          </button>

          <button onclick='exitQuiz()'
            class='border px-5 py-3 rounded-xl'>
            Home
          </button>
        </div>

      </div>
    </div>
  `;

  updateStats();
}

/* =========================================================
   GRADE
========================================================= */
function grade(){

  if(submitted) return;
  submitted = true;

  const fields = ACTIVE_FIELDS || FIELD_SCHEMA;

  let score = 0;
  let nonYearTotal = 0;
  let nonYearCorrect = 0;
  let out = '';

  fields.forEach(f=>{

    const input = $('#'+f);
    const vRaw = input.value.trim();
    const v = vRaw.toLowerCase();

    const aRaw = (current[f] || '').toString();
    const a = aRaw.toLowerCase();

    let ok = false;

    if(f==='year' && aRaw.includes('-')){

      const p = aRaw.split('-').map(x=>parseInt(x.trim(),10));
      const n = parseInt(vRaw,10);

      if(!isNaN(n) && p.length===2){
        ok = n>=p[0] && n<=p[1];
      }

    } else if(f==='movement' && a.includes(' or ')) {

      const opts = a.split(/\s+or\s+/).map(x=>x.trim());
      ok = opts.includes(v);

    } else {

      ok = v && a && (
        v===a ||
        v.includes(a) ||
        a.includes(v)
      );
    }

    if(ok) score++;

    if(f !== 'year'){
      nonYearTotal++;

      if(ok){
        nonYearCorrect++;
      }
    }

    fieldStats[f].attempts++;

    if(ok){
      fieldStats[f].correct++;
    }

    if(f === 'year'){
      const actual = yearValue(aRaw);
      const guess = parseInt(vRaw,10);

      if(!isNaN(guess) && actual){
        yearErrors.push(guess - actual);
      }
    }

    input.disabled = true;

    out += `
      <div class='mb-1'>
        <span class='font-medium'>${f}:</span>
        <span class='${ok ? 'text-green-600':'text-red-600'}'>
          ${vRaw || '(empty)'}
        </span>
        <span class='text-zinc-500 ml-2'>
          (correct: ${current[f]})
        </span>
      </div>
    `;
  });

  answered++;
  totalFieldsAttempted += nonYearTotal;
  totalFieldsCorrect += nonYearCorrect;

  const acc =
    totalFieldsAttempted
      ? Math.round(
          100 *
          totalFieldsCorrect /
          totalFieldsAttempted
        )
      : 0;

  const rmse = calcRMSE(yearErrors);

  if(score === fields.length){
    perfect++;
    streak++;
    if(streak > bestStreak){
      bestStreak = streak;
    }
  } else {
    streak = 0;
  }

  $('#result').innerHTML =
    "<div class='bg-zinc-50 border border-zinc-200 rounded-2xl p-4'>" +
    "<div class='font-bold text-lg mb-3'>Score " +
    score + "/" + fields.length +
    "</div>" +
    out +
    "</div>";

  document
    .getElementById('quizFields')
    .classList.add('hidden');

  $('#submit').classList.add('hidden');

  const nextBtn = $('#next');

  /* fully reset button state */
  nextBtn.classList.remove('hidden');
  nextBtn.disabled = false;
  nextBtn.style.pointerEvents = 'auto';
  nextBtn.style.opacity = '1';

  /* rebind click every submit */
  nextBtn.onclick = next;

  /* focus for Enter key flow */
  nextBtn.focus();

  updateStats();
}

/* =========================================================
   TIMELINE
========================================================= */
const TIMELINE_PAD = 100;
const PX_PER_YEAR = 12;
const CARD_W = 170;
const CARD_H = 150;
const LANE_H = 165;

/* 80 colors */
const PALETTE_80 = [
"#e11d48","#f97316","#f59e0b","#eab308","#84cc16","#22c55e","#10b981","#14b8a6",
"#06b6d4","#0ea5e9","#3b82f6","#6366f1","#8b5cf6","#a855f7","#d946ef","#ec4899",
"#f43f5e","#fb7185","#fca5a5","#fdba74","#fde047","#bef264","#86efac","#5eead4",
"#67e8f9","#93c5fd","#a5b4fc","#c4b5fd","#d8b4fe","#f0abfc","#f9a8d4","#fecdd3",
"#991b1b","#9a3412","#92400e","#854d0e","#365314","#14532d","#064e3b","#134e4a",
"#0c4a6e","#1e3a8a","#312e81","#4c1d95","#581c87","#701a75","#831843","#881337",
"#b91c1c","#c2410c","#d97706","#ca8a04","#65a30d","#16a34a","#059669","#0d9488",
"#0284c7","#2563eb","#4338ca","#6d28d9","#7e22ce","#a21caf","#be185d","#e11d48",
"#1f2937","#374151","#4b5563","#6b7280","#9ca3af","#d1d5db","#e5e7eb","#f3f4f6"
];

const movementMap = new Map();
let movementColorIndex=0;

function getColor(tag){
  if(!movementMap.has(tag)){
    movementMap.set(
      tag,
      PALETTE_80[movementColorIndex % PALETTE_80.length]
    );
    movementColorIndex++;
  }
  return movementMap.get(tag);
}

function parseMovements(v){
  if(!v) return [];

  return v
    .replace(/\(.*?\)/g,'')
    .split('/')
    .map(s=>s.trim().toLowerCase())
    .filter(Boolean);
}

function xPos(year,minYear){
  return TIMELINE_PAD + (yearNumSafe(year)-minYear)*PX_PER_YEAR;
}

function buildMovementAnchors(rows){
  const firstSeen=new Map();

  rows.forEach(r=>{
    const y=yearNumSafe(r.year);

    parseMovements(r.movement).forEach(m=>{
      if(!firstSeen.has(m) || y<firstSeen.get(m)){
        firstSeen.set(m,y);
      }
    });
  });

  return [...firstSeen.entries()]
    .map(([movement,year])=>({movement,year}))
    .sort((a,b)=>a.year-b.year);
}

function openTimeline(){

  const allRows=[...data].filter(r=>r.year);

  if(!allRows.length){
    toast("No dated works found");
    return;
  }

  const win=window.open("","timeline");

  win.document.write(`
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Timeline</title>
</head>
<body style="margin:0;background:white;font-family:Arial,sans-serif;"></body>
</html>
  `);
  win.document.close();

  const doc=win.document;
  const body=doc.body;

  function openLightbox(src){
    const overlay = doc.createElement('div');

    function esc(e){
      if(e.key === 'Escape'){
        overlay.remove();
        doc.removeEventListener('keydown', esc);
      }
    }

    doc.addEventListener('keydown', esc);

    overlay.style.cssText = `
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.88);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9999;
      cursor:pointer;
      padding:32px;
    `;

    overlay.innerHTML = `
      <img
        src="${src}"
        style="
          max-width:95vw;
          max-height:95vh;
          object-fit:contain;
          border-radius:10px;
          box-shadow:0 20px 60px rgba(0,0,0,.45);
          background:white;
        ">
    `;

    overlay.onclick = () => overlay.remove();

    doc.body.appendChild(overlay);
  }

  /* =======================================================
     STATE
  ======================================================= */
  const selected = new Set();

  let zoom = 12;
  const ZMIN = 4;
  const ZMAX = 40;

  const LEFT_PAD = 100;
  const CARD_W = 170;
  const LANE_H = 184;
  const HEADER_H = 54;

  const LABEL_ROW_H = 26;
  const LABEL_TOP_PAD = 8;
  const LABEL_BOTTOM_PAD = 10;

  const minYear=Math.min(...allRows.map(r=>yearNumSafe(r.year)));
  const maxYear=Math.max(...allRows.map(r=>yearNumSafe(r.year)));

  function xPos(year){
    return LEFT_PAD + (yearNumSafe(year)-minYear)*zoom;
  }

  function widthNow(){
    return LEFT_PAD + (maxYear-minYear+1)*zoom + LEFT_PAD;
  }

  function tagsOf(str){
    return parseMovements(str)
      .map(s=>s.replace(/\//g,'').trim())
      .filter(Boolean);
  }

  /* =======================================================
     COLORS
  ======================================================= */
  const palette=[
    "#1d4ed8","#2563eb","#15803d","#16a34a","#b91c1c","#dc2626",
    "#c2410c","#ea580c","#a16207","#ca8a04","#7c3aed","#6d28d9",
    "#be185d","#db2777","#0f766e","#0d9488","#0369a1","#0284c7",
    "#4338ca","#4f46e5","#374151","#1f2937"
  ];

  const colorMap=new Map();
  let cIdx=0;

  function getColor(m){
    if(!colorMap.has(m)){
      colorMap.set(m,palette[cIdx % palette.length]);
      cIdx++;
    }
    return colorMap.get(m);
  }

  function rowIncluded(r){
    if(selected.size===0) return true;
    return tagsOf(r.movement).some(t=>selected.has(t));
  }

  /* =======================================================
     LABEL LAYOUT (dynamic height)
  ======================================================= */
  function buildLabels(){

    const firstSeen=new Map();

    allRows.forEach(r=>{
      const y=yearNumSafe(r.year);
      tagsOf(r.movement).forEach(t=>{
        if(!firstSeen.has(t) || y<firstSeen.get(t)){
          firstSeen.set(t,y);
        }
      });
    });

    const anchors=[...firstSeen.entries()]
      .map(([movement,year])=>({movement,year}))
      .sort((a,b)=>a.year-b.year);

    const lanes=[];

    const items = anchors.map(a=>{

      const x=xPos(a.year);
      const est=Math.max(72,a.movement.length*7+24);

      let lane=0;

      while(true){
        if(!lanes[lane]) lanes[lane]=[];

        const clash=lanes[lane].some(o =>
          Math.abs(o.x-x) < ((o.w+est)/2 + 8)
        );

        if(!clash){
          lanes[lane].push({x,w:est});
          break;
        }

        lane++;
      }

      return {
        ...a,
        x,
        lane
      };
    });

    const laneCount = Math.max(1, lanes.length);

    const LABEL_H =
      LABEL_TOP_PAD +
      laneCount * LABEL_ROW_H +
      LABEL_BOTTOM_PAD;

    const html = items.map(a=>{

      const active=selected.has(a.movement);

      return `
        <div data-move="${a.movement}" style="
          position:absolute;
          left:${a.x}px;
          top:${LABEL_TOP_PAD + a.lane*LABEL_ROW_H}px;
          transform:translateX(-50%);
          white-space:nowrap;
          padding:3px 8px;
          border-radius:999px;
          font-size:12px;
          font-weight:700;
          cursor:pointer;
          user-select:none;
          color:${active?'white':getColor(a.movement)};
          background:${active?getColor(a.movement):'white'};
          border:1px solid ${getColor(a.movement)};
          box-shadow:0 1px 4px rgba(0,0,0,.08);
        ">${a.movement}</div>
      `;
    }).join("");

    return { LABEL_H, html };
  }

  /* =======================================================
     RETILE VISIBLE CARDS ONLY
  ======================================================= */
  function packVisible(rows){

    const lanes=[];

    return rows.map(r=>{

      const x=xPos(r.year);

      let lane=0;

      while(true){
        if(!lanes[lane]) lanes[lane]=[];

        const clash=lanes[lane].some(px =>
          Math.abs(px-x) < CARD_W+18
        );

        if(!clash){
          lanes[lane].push(x);
          break;
        }

        lane++;
      }

      return {...r,x,lane};
    });
  }

  /* =======================================================
     RENDER
  ======================================================= */
  function render(keepCenter=true){

    const oldScroller = body.querySelector("#scrollWrap");
    const prevX = oldScroller ? oldScroller.scrollLeft : 0;
    const prevY = oldScroller ? oldScroller.scrollTop : 0;
    const prevW = oldScroller ? oldScroller.clientWidth : 0;
    const oldSW = oldScroller ? oldScroller.scrollWidth : 1;

    const { LABEL_H, html:labels } = buildLabels();

    const visibleRows = allRows
      .filter(rowIncluded)
      .sort((a,b)=>yearNumSafe(a.year)-yearNumSafe(b.year));

    const positioned = packVisible(visibleRows);

    const laneCount =
      positioned.length
        ? Math.max(...positioned.map(r=>r.lane))+1
        : 1;

    const totalHeight =
      LABEL_H +
      laneCount * LANE_H +
      140;

    /* ticks */
    let ticks="";
    const tickLineTop = LABEL_H + 18;

    for(let y=minYear;y<=maxYear;y+=25){

      const x=xPos(y);

      ticks += `
        <div style="
          position:absolute;
          left:${x}px;
          top:${LABEL_H + 2}px;
          transform:translateX(-50%);
          font-size:11px;
          color:#64748b;
          z-index:2;
        ">${y}</div>

        <div style="
          position:absolute;
          left:${x}px;
          top:${tickLineTop}px;
          width:1px;
          height:${totalHeight-tickLineTop}px;
          background:#edf2f7;
          z-index:1;
        "></div>
      `;
    }

    /* cards */
    const cards = positioned.map(r=>{

      const top = LABEL_H + 34 + r.lane*LANE_H;

      const strip = tagsOf(r.movement).map(t=>`
        <div style="flex:1;background:${getColor(t)};"></div>
      `).join("");

      return `
        <div
        data-full="${r.image}"
        style="
          position:absolute;
          cursor:pointer;
          left:${r.x}px;
          top:${top}px;
          width:${CARD_W}px;
          transform:translateX(-50%);
          z-index:10;
        ">
          <div style="
            background:white;
            border-radius:14px;
            overflow:hidden;
            border:1px solid #e5e7eb;
            box-shadow:0 6px 14px rgba(0,0,0,.08);
          ">
            <div style="height:8px;display:flex;">
              ${strip}
            </div>

            <img src="${thumbUrl(r.image)}" loading="lazy" decoding="async" style="
              width:100%;
              height:104px;
              object-fit:contain;
              background:#f8fafc;
            ">

            <div style="padding:8px">
              <div style="font-size:12px;font-weight:700;">
                ${r.title}
              </div>
              <div style="font-size:11px;color:#64748b;">
                ${r.artist}
              </div>
              <div style="font-size:10px;color:#94a3b8;">
                ${r.year}
              </div>
            </div>
          </div>
        </div>
      `;
    }).join("");

    body.innerHTML=`
      <div style="
        position:sticky;
        top:0;
        z-index:60;
        height:${HEADER_H}px;
        background:white;
        border-bottom:1px solid #e5e7eb;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:0 16px;
      ">
        <div style="font-size:20px;font-weight:800;">
          Art Timeline
        </div>

        <div style="display:flex;gap:8px;align-items:center;">
          <button id="zoomOut" style="
            border:1px solid #d1d5db;
            background:white;
            border-radius:8px;
            padding:4px 10px;
            cursor:pointer;
          ">−</button>

          <div style="
            font-size:12px;
            color:#475569;
            min-width:58px;
            text-align:center;
          ">${zoom.toFixed(1)} px/yr</div>

          <button id="zoomIn" style="
            border:1px solid #d1d5db;
            background:white;
            border-radius:8px;
            padding:4px 10px;
            cursor:pointer;
          ">+</button>
        </div>
      </div>

      <div id="scrollWrap" style="
        height:calc(100vh - ${HEADER_H}px);
        overflow:auto;
      ">
        <div style="
          position:relative;
          width:${widthNow()}px;
          height:${totalHeight}px;
          background:white;
        ">

          <div style="
            position:sticky;
            top:0;
            z-index:40;
            height:${LABEL_H}px;
            background:rgba(255,255,255,.97);
            border-bottom:1px solid #e5e7eb;
          ">
            <div style="
              position:relative;
              width:${widthNow()}px;
              height:${LABEL_H}px;
            ">
              ${labels}
            </div>
          </div>

          ${ticks}
          ${cards}

        </div>
      </div>
    `;

    const scroller = body.querySelector("#scrollWrap");

    if(oldScroller && keepCenter){
      const centerRatio = (prevX + prevW/2) / oldSW;
      const newX =
        centerRatio * scroller.scrollWidth -
        scroller.clientWidth/2;

      scroller.scrollLeft=Math.max(0,newX);
      scroller.scrollTop=prevY;
    }else{
      scroller.scrollLeft=prevX;
      scroller.scrollTop=prevY;
    }

    /* movement clicks */
    body.querySelectorAll("[data-move]").forEach(el=>{
      el.onclick=()=>{
        const m=el.dataset.move;
        if(selected.has(m)) selected.delete(m);
        else selected.add(m);
        render(false);
      };
    });

    body.querySelectorAll('[data-full]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        openLightbox(el.dataset.full);
      };
    });

    /* zoom */
    body.querySelector("#zoomIn").onclick=()=>{
      zoom=Math.min(ZMAX,zoom*1.25);
      render(true);
    };

    body.querySelector("#zoomOut").onclick=()=>{
      zoom=Math.max(ZMIN,zoom/1.25);
      render(true);
    };
  }

  render(false);
}

/* =========================================================
   ADD ENTRY
========================================================= */
async function addEntry(){
  if(!token) return toast('No token');

  const path=active.file;

  const meta=await fetch(
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,
    {
      headers:{Authorization:'Bearer '+token}
    }
  ).then(r=>r.json());

  const latestCsv=atob(meta.content.replace(/\n/g,''));
  data=parseCSV(latestCsv);

  const row={image:$('#nimage').value.trim()};

  FIELD_SCHEMA.forEach(f=>{
    row[f]=$('#n'+f).value.trim();
  });

  data.push(row);

  await fetch(
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,
    {
      method:'PUT',
      headers:{
        Authorization:'Bearer '+token,
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        message:'update dataset',
        content:btoa(
          unescape(
            encodeURIComponent(csvOut(data))
          )
        ),
        sha:meta.sha,
        branch:BRANCH
      })
    }
  );

  toast('Saved');

  await load();
  applyQuizSettings();
}
