<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Quiz Hub Production</title>
<script src='https://cdn.tailwindcss.com'></script>
</head>
<body class='bg-gradient-to-br from-stone-100 via-zinc-100 to-neutral-200 min-h-screen text-zinc-900'>
<div class='max-w-6xl mx-auto p-6'>
<header class='mb-10'>
<h1 class='text-6xl font-bold tracking-tight'>Quiz Hub</h1>
<p class='text-zinc-600 mt-2'>Museum-grade study platform with analytics, elegant design, and GitHub dataset sync.</p>
</header>
<div id='home'></div>
<div id='quizPage' class='hidden'></div>
<div id='toast' class='fixed bottom-6 right-6 hidden bg-black text-white px-4 py-3 rounded-2xl shadow-xl'></div>
</div>
<script>
const OWNER='tyler-hattori';
const REPO='trivia';
const BRANCH='main';
const QUIZZES=[
 {key:'art',title:'Art History',file:'datasets/art.csv',fields:['title','artist','year','genre']},
 {key:'music',title:'Music',file:'datasets/music.csv',fields:['title','artist','year','genre']}
];

let token=localStorage.getItem('gh_pat') || '';
let active=null;
let data=[];
let current=null;

const $ = (s)=>document.querySelector(s);
function scoreKey(k){ return 'score_'+k; }
function best(k){ return Number(localStorage.getItem(scoreKey(k)) || 0); }
function setBest(k,v){ if(v>best(k)) localStorage.setItem(scoreKey(k), String(v)); }
function avgAcc(k){ return Number(localStorage.getItem('acc_'+k) || 0); }

function parseCSV(text){
 const rows=text.trim().split(/\r?\n+/);
 return rows.map((row,i)=>{
   const c=row.split(',');
   if(i===0 && c[0] && c[0].trim().toLowerCase()==='image') return null;
   return {
     image:(c[0]||'').trim(),
     title:(c[1]||'').trim(),
     artist:(c[2]||'').trim(),
     year:(c[3]||'').trim(),
     genre:(c[4]||'').trim()
   };
 }).filter(Boolean).filter(r=>r.image);
}

function csvOut(rows){
 const header='image,title,artist,year,genre';
 const lines=rows.map(r=>[r.image,r.title,r.artist,r.year,r.genre].join(','));
 return [header,...lines].join('\n');
}

let queue=[];
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function refillQueue(){queue=shuffle([...data]);}
function rand(){ if(!queue.length) refillQueue(); return queue.pop(); }

function toast(msg){
 const el=$('#toast');
 el.textContent=msg;
 el.classList.remove('hidden');
 setTimeout(()=>el.classList.add('hidden'),1800);
}

function renderHome(){
 const home=$('#home');
 if(!home) return;
 home.innerHTML=`
 <div class='grid md:grid-cols-3 gap-6'>
 ${QUIZZES.map(q=>`
 <button onclick="openQuiz('${q.key}')" class='bg-white rounded-3xl shadow-lg p-6 border border-zinc-100 text-left hover:shadow-xl transition'>
 <div class='text-2xl font-semibold'>${q.title}</div>
 <div class='text-zinc-500 mt-2'>Best Score: ${best(q.key)} · Avg Accuracy: ${avgAcc(q.key)}%</div>
 </button>`).join('')}
 </div>
 <div class='mt-8 bg-white rounded-3xl shadow-lg p-6 border border-zinc-100'>
 <div class='font-semibold mb-2'>GitHub Token</div>
 <input id='pat' class='border rounded-xl p-3 w-full' placeholder='Paste PAT token' value='${token}'>
 <button onclick='saveToken()' class='mt-3 px-4 py-2 bg-black text-white rounded-xl'>Save Token</button>
 </div>`;
}

function saveToken(){
 const input=$('#pat');
 token=input ? input.value.trim() : '';
 localStorage.setItem('gh_pat',token);
 toast('Token saved locally');
}

async function openQuiz(key){
 active=QUIZZES.find(q=>q.key===key);
 $('#home').classList.add('hidden');
 $('#quizPage').classList.remove('hidden');
 await loadDataset();
 nextCard();
}

async function loadDataset(){
 const txt=await fetch(active.file).then(r=>r.text());
 data=parseCSV(txt);
 renderQuizPage();
}

function renderQuizPage(){
 $('#quizPage').innerHTML=`
 <button onclick='goHome()' class='mb-4 px-3 py-2 border rounded-xl'>← Home</button>
 <div class='bg-white rounded-3xl shadow-lg p-6 border border-zinc-100'>
 <div class='flex justify-between items-center'>
 <h2 class='text-3xl font-bold'>${active.title}</h2>
 <div>Best: ${best(active.key)}</div>
 </div>
 <img id='img' class='w-full max-h-[420px] object-contain bg-zinc-50 rounded-2xl my-5'>
 <div class='grid md:grid-cols-2 gap-3'>
 ${active.fields.map(f=>`<input id='${f}' class='border rounded-xl p-3' placeholder='${f}'>`).join('')}
 </div>
 <div class='mt-4 flex gap-3'>
 <button onclick='grade()' class='px-4 py-2 bg-blue-600 text-white rounded-xl'>Submit</button>
 <button onclick='nextCard()' class='px-4 py-2 border rounded-xl'>Next</button>
 </div>
 <div id='result' class='mt-4 text-sm'></div>
 </div>
 <div class='bg-white rounded-3xl shadow-lg p-6 border border-zinc-100 mt-6'>
 <h3 class='text-xl font-semibold mb-3'>Add Entry + Sync CSV</h3>
 <div class='grid md:grid-cols-2 gap-3'>
 <input id='nimage' class='border rounded-xl p-3' placeholder='Image URL'>
 <input id='ntitle' class='border rounded-xl p-3' placeholder='Title'>
 <input id='nartist' class='border rounded-xl p-3' placeholder='Artist'>
 <input id='nyear' class='border rounded-xl p-3' placeholder='Year'>
 <input id='ngenre' class='border rounded-xl p-3 md:col-span-2' placeholder='Genre'>
 </div>
 <button onclick='addEntry()' class='mt-4 px-4 py-2 bg-black text-white rounded-xl'>Commit to GitHub CSV</button>
 </div>`;
}

function nextCard(){
 if(!data.length) return;
 current=rand();
 $('#img').src=current.image;
 active.fields.forEach(f=>{ const el=$('#'+f); if(el) el.value=''; });
 $('#result').innerHTML='';
}

function sim(a,b){
 a=String(a).trim().toLowerCase();
 b=String(b).trim().toLowerCase();
 if(!a || !b) return false; return a===b || (a.length>2 && b.includes(a)) || (b.length>2 && a.includes(b));
}

function grade(){
 let s=0;
 let out='';
 active.fields.forEach(f=>{
   const ok=sim($('#'+f).value,current[f]);
   if(ok) s++;
   out+=`<div>${f}: ${ok?'✓':'✗'} <span class='text-zinc-500'>${current[f]}</span></div>`;
 });
 setBest(active.key,s);
 const pct=Math.round((s/active.fields.length)*100);
 localStorage.setItem('acc_'+active.key,String(pct));
 $('#result').innerHTML=`<div class='font-semibold mb-2 text-lg'>Score ${s}/${active.fields.length} (${pct}%)</div>${out}`;
}

function goHome(){
 $('#quizPage').classList.add('hidden');
 $('#home').classList.remove('hidden');
 renderHome();
}

async function addEntry(){
 try{
 if(!OWNER || OWNER==='YOUR_GITHUB_USERNAME' || !REPO || REPO==='YOUR_REPO_NAME'){toast('Set OWNER and REPO in config');return;}
 if(!token){toast('Save PAT token first');return;}
 if(!token){ toast('Save PAT token first'); return; }
 const row={
   image:$('#nimage').value,
   title:$('#ntitle').value,
   artist:$('#nartist').value,
   year:$('#nyear').value,
   genre:$('#ngenre').value
 };
 data.push(row);
 const path=active.file;
 const meta=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{
   headers:{Authorization:'Bearer '+token}
 }).then(r=>r.json());
 const content=csvOut(data);
 await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{
   method:'PUT',
   headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
   body:JSON.stringify({
     message:'Update '+path,
     content:btoa(unescape(encodeURIComponent(content))),
     sha:meta.sha,
     branch:BRANCH
   })
 });
 toast('CSV committed to GitHub');
 await loadDataset();
 refillQueue();
 } catch(err){ console.error(err); toast('GitHub sync failed'); }
}

document.addEventListener('DOMContentLoaded',renderHome);
</script>
</body>
</html>
